[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-relex"
version = "0.1.0"
description = "Python implementation of the RELEX relativistic Coulomb-excitation model"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Stylianos Nikas"}]
dependencies = ["numpy>=1.23", "scipy>=1.10", "streamlit>=1.30", "pandas>=2.0"]

[project.scripts]
relex = "relex.cli:main"

[tool.setuptools.packages.find]
include = ["relex*"]
